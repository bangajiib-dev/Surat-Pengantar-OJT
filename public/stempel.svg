<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- Path for top curved text: PT. INDOMARCO PRISMATAMA -->
    <path id="curve-top" d="M 45,150 A 105,105 0 0,1 255,150" fill="none" />
    <!-- Path for bottom curved text: SURABAYA -->
    <path id="curve-bottom" d="M 245,150 A 95,95 0 0,1 55,150" fill="none" />
    <filter id="ink-bleed" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" />
    </filter>
  </defs>

  <g transform="rotate(-6 150 150)" opacity="0.88">
    <!-- Outer concentric stamp rings in authentic blue stamp ink -->
    <circle cx="150" cy="150" r="132" fill="none" stroke="#253b80" stroke-width="3.5" />
    <circle cx="150" cy="150" r="126" fill="none" stroke="#253b80" stroke-width="1.5" />

    <!-- Inner circle -->
    <circle cx="150" cy="150" r="86" fill="none" stroke="#253b80" stroke-width="2" />
    <circle cx="150" cy="150" r="82" fill="none" stroke="#253b80" stroke-width="1" />

    <!-- Stars separating text -->
    <polygon points="150,26 153,34 161,34 154,39 157,47 150,42 143,47 146,39 139,34 147,34" fill="#253b80" transform="translate(-115, 118) scale(0.7)" />
    <polygon points="150,26 153,34 161,34 154,39 157,47 150,42 143,47 146,39 139,34 147,34" fill="#253b80" transform="translate(115, 118) scale(0.7)" />

    <!-- Top curved text -->
    <text fill="#253b80" font-family="'Arial', 'Helvetica', sans-serif" font-size="19" font-weight="900" letter-spacing="3.2">
      <textPath href="#curve-top" startOffset="50%" text-anchor="middle">
        PT. INDOMARCO PRISMATAMA
      </textPath>
    </text>

    <!-- Bottom curved text -->
    <text fill="#253b80" font-family="'Arial', 'Helvetica', sans-serif" font-size="17" font-weight="800" letter-spacing="4">
      <textPath href="#curve-bottom" startOffset="50%" text-anchor="middle">
        SURABAYA
      </textPath>
    </text>

    <!-- Center inner lines / emblem -->
    <line x1="75" y1="135" x2="225" y2="135" stroke="#253b80" stroke-width="1.2" stroke-dasharray="3 2" />
    <line x1="75" y1="165" x2="225" y2="165" stroke="#253b80" stroke-width="1.2" stroke-dasharray="3 2" />
    <text x="150" y="154" fill="#253b80" font-family="'Arial', 'Helvetica', sans-serif" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="2">
      TRAINING CENTER
    </text>
  </g>

  <!-- Overlay Handwritten Signature in realistic blue-black fountain ink -->
  <g stroke="#1e293b" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-3 150 150)">
    <!-- Swirl and initial flourish -->
    <path d="M 68,175 C 80,135 105,100 120,95 C 135,90 142,125 140,155 C 138,185 130,205 125,200 C 120,195 125,160 148,140 C 170,120 190,130 195,150 C 198,165 188,180 180,185 C 172,190 185,170 205,155 C 220,145 235,150 245,160" />
    <!-- Cross strike & underline flourish -->
    <path d="M 85,158 Q 165,142 248,152" stroke-width="2.2" />
    <path d="M 105,178 Q 155,168 215,188" stroke-width="1.8" />
    <!-- Loop detail -->
    <path d="M 128,110 C 132,100 140,102 142,118 C 144,135 136,150 134,168" stroke-width="2.4" />
  </g>
</svg>
